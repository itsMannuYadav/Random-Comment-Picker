<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MySocial — Comment Picker</title>
    <link rel="stylesheet" href="../video-downloader/video-downloader.css" />
    <link rel="stylesheet" href="comment-picker.css" />
  </head>
  <body>
    <header class="brand">
      <img src="../../icons/icon48.png" alt="" width="24" height="24" />
      <span>MySocial Comment Picker</span>
    </header>

    <main>
      <div id="notice" class="notice" hidden></div>
      <div id="resource"></div>

      <form id="filters-form" class="filters-form" hidden>
        <div class="filters-row">
          <label>Winners
            <input type="number" id="winner-count" min="1" max="1000" value="1" />
          </label>
          <label class="checkbox"><input type="checkbox" id="one-per-person" checked /> One entry per person</label>
          <label class="checkbox"><input type="checkbox" id="exclude-replies" /> Top-level comments only</label>
        </div>
        <div class="filters-row">
          <input type="text" id="keyword" placeholder="Require a keyword (optional)" />
          <label class="checkbox"><input type="checkbox" id="exclude-links" /> Exclude comments with links</label>
        </div>
        <button type="submit" id="pick-btn">Pick Winner</button>
      </form>

      <div id="result"></div>
    </main>

    <script src="../../utils/config.js"></script>
    <script src="../../utils/detect.js"></script>
    <script src="comment-picker.js"></script>
  </body>
</html>
